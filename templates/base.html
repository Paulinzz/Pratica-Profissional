<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <!-- Modern CSS - Modular Architecture -->
    <link rel="stylesheet" href="{{url_for('static', filename='css/main.css')}}">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Favicon -->
    <link rel="icon" href="{{url_for('static', filename='imagens/correto.png')}}" type="image/x-icon">

    <title>
        {% block title %}
        FocusUp - Templates
        {% endblock %}
    </title>
</head>
<body>
    <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo principal</a>

    {% include 'navbar.html' %}
    {% block conteudo %}
    {% endblock %}

    {% include 'footer.html' %}

    <script src="{{url_for('static', filename='scripts/main.js')}}"></script>

    <script>
        // Inicializar tema baseado na preferência do usuário
        {% if current_user.is_authenticated %}
            {% if current_user.tema_escuro %}
                document.addEventListener('DOMContentLoaded', function() {
                    document.body.classList.add('dark-mode');
                    document.getElementById('themeIcon').classList.remove('fa-moon');
                    document.getElementById('themeIcon').classList.add('fa-sun');
                    document.getElementById('themeToggle').classList.add('dark');
                });
            {% endif %}
        {% endif %}
    </script>

</body>
</html>
